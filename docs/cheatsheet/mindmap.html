<style>
/* Mind map: every service in the tag vocabulary, grouped by the exam domain most of its questions test,
   drawn as a horizontal tree that pans and zooms. The data is generated by scripts/build-mindmap.js. */
body.mm-page{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.mm-stage{position:relative;flex:1;min-height:0;overflow:hidden;
  background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--line) 85%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
.mm-viewport{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none}
.mm-viewport.panning{cursor:grabbing}
.mm-world{position:absolute;left:0;top:0;transform-origin:0 0}
.mm-world.glide{transition:transform .35s ease}
.mm-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mm-links path{fill:none;stroke:color-mix(in srgb,var(--muted) 50%,transparent);stroke-width:1.6}
.mm-node{position:absolute;display:flex;align-items:center}

/* nodes, by level */
.mm-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 11px 6px 7px;font:600 13.5px/1.25 var(--sans);text-align:left;white-space:nowrap;box-shadow:var(--shadow);cursor:pointer}
.mm-btn:hover{border-color:var(--accent)}
.mm-btn img,.mm-ini{width:22px;height:22px;border-radius:5px;flex:none}
.mm-ini{display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font:700 9.5px var(--mono);letter-spacing:.02em}
.mm-n{font:600 11px var(--mono);color:var(--muted)}
.mm-k-root .mm-btn{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:10px 16px;border-radius:12px;flex-direction:column;align-items:flex-start;gap:1px}
.mm-k-root .mm-btn b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.mm-k-root .mm-btn small{font:500 11.5px var(--sans);opacity:.75}
.mm-k-domain .mm-btn{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);padding:8px 13px 8px 9px;gap:10px}
.mm-k-domain .mm-btn b{display:block;font-size:15px;font-weight:800}
.mm-k-domain .mm-btn small{display:block;font:500 11.5px var(--sans);color:var(--muted)}
.mm-dn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px var(--mono);flex:none}
.mm-k-cat .mm-btn{background:var(--surface-2);border-color:transparent;box-shadow:none;border-radius:999px;padding:5px 12px;font:700 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mm-k-cat .mm-btn:hover{color:var(--ink)}
.mm-k-feat .mm-btn{box-shadow:none;background:color-mix(in srgb,var(--surface) 70%,transparent);border-style:dashed;font-weight:500;font-size:12.5px;padding:4px 10px;border-radius:8px}
.mm-node.sel .mm-btn{outline:2px solid var(--accent);outline-offset:2px}

/* the open / fold bubble on a node's right edge */
.mm-tog{position:absolute;right:-11px;top:50%;transform:translateY(-50%);min-width:21px;height:21px;padding:0 5px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);background:var(--surface);color:var(--muted);font:700 10px/1 var(--mono);display:grid;place-items:center;cursor:pointer}
.mm-tog:hover{border-color:var(--accent);color:var(--accent)}
.mm-tog[aria-expanded="true"]{font-size:13px}

/* progress overlay: latest answer per tagged question */
.mm-score{display:none;align-items:center;gap:5px;font:700 11px var(--mono);border-radius:999px;padding:1px 7px 1px 3px;background:var(--surface-2);color:var(--muted)}
.mm-score svg{width:14px;height:14px;flex:none;transform:rotate(-90deg)}
.mm-score circle{fill:none;stroke-width:3}
.mm-score .bg{stroke:color-mix(in srgb,currentColor 25%,transparent)}
.mm-score .fg{stroke:currentColor}
.mm-on .mm-score{display:inline-flex}
.mm-on .mm-n{display:none}
[data-lv="good"]{--lv:var(--good);--lv-soft:var(--good-soft)}
[data-lv="mid"]{--lv:var(--warn);--lv-soft:var(--warn-soft)}
[data-lv="bad"]{--lv:var(--bad);--lv-soft:var(--bad-soft)}
.mm-on .mm-node[data-lv]:not([data-lv="none"]) .mm-score,.mm-panel [data-lv]:not([data-lv="none"]).mm-score{background:var(--lv-soft);color:var(--lv)}
.mm-on .mm-k-svc[data-lv]:not([data-lv="none"]) .mm-btn,.mm-on .mm-k-feat[data-lv]:not([data-lv="none"]) .mm-btn{border-color:var(--lv);box-shadow:inset 3px 0 0 var(--lv),var(--shadow)}
.mm-on .mm-k-svc[data-lv="none"] .mm-btn{opacity:.8}

/* floating controls */
.mm-tools{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;pointer-events:none}
.mm-tools>*{pointer-events:auto}
.mm-tb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--sans);box-shadow:var(--shadow);white-space:nowrap}
.mm-tb:hover{border-color:var(--accent)}
.mm-tb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-sw{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.mm-sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.mm-tb[aria-checked="true"] .mm-sw{background:var(--accent)}
.mm-tb[aria-checked="true"] .mm-sw::after{transform:translateX(12px)}
.mm-zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;gap:6px;z-index:5}
.mm-zoom .mm-tb{width:38px;height:38px;padding:0;justify-content:center}
.mm-legend{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));right:64px;max-width:420px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;font-size:12px;color:var(--muted);line-height:1.45}
.mm-legend .row{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.mm-legend .row span{display:inline-flex;align-items:center;gap:5px}
.mm-legend i{width:10px;height:10px;border-radius:50%;background:var(--lv,var(--line));display:inline-block}
.mm-legend a{color:var(--accent);font-weight:600}
@media (max-width:520px){.mm-tb .lbl-long{display:none}}

/* detail panel: a drawer on the right, a bottom sheet on phones; it sits outside the top bar and the
   transformed map so position:fixed works */
.mm-panel{position:fixed;z-index:30;top:var(--tbh,57px);right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(15,23,42,.12);overflow-y:auto;overscroll-behavior:contain;padding:18px 18px calc(28px + env(safe-area-inset-bottom));animation:mmIn .18s ease-out;outline:none}
.mm-panel>*+*{margin-top:16px}
@keyframes mmIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes mmUp{from{transform:translateY(32px);opacity:.6}to{transform:none;opacity:1}}
.mm-handle{display:none}
@media (max-width:640px){
  .mm-panel{top:auto;left:0;width:100%;max-height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(15,23,42,.18);padding-top:8px;animation:mmUp .2s ease-out}
  .mm-handle{display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
}
.mm-p-head{display:flex;align-items:center;gap:12px;padding-right:36px;position:relative}
.mm-p-head img,.mm-p-head .mm-ini{width:42px;height:42px;border-radius:9px;font-size:13px}
.mm-p-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.mm-p-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.mm-x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.mm-x:hover{color:var(--ink);border-color:var(--muted)}
.mm-x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.mm-cue{background:var(--accent-soft);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;line-height:1.5}
.mm-panel h3{font:700 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.mm-panel ul{font-size:14px;line-height:1.5}
.mm-panel ul li+li{margin-top:4px}
.mm-chips{display:flex;flex-wrap:wrap;gap:6px}
.mm-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font:500 12.5px var(--sans);text-decoration:none}
.mm-chip.noico{padding-left:10px}
.mm-chip img,.mm-chip .mm-ini{width:18px;height:18px;border-radius:4px;font-size:7.5px}
.mm-chip b{font-weight:700}
.mm-chip .n{font:600 11px var(--mono);color:var(--muted)}
button.mm-chip:hover,a.mm-chip:hover{border-color:var(--accent)}
.mm-chip.primary{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.mm-links-list{display:grid;gap:6px}
.mm-links-list a{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.mm-links-list a:hover{border-color:var(--accent)}
.mm-links-list a span{font:600 11px var(--mono);color:var(--accent);flex:none}
.mm-prog{display:flex;align-items:center;gap:10px;font-size:13.5px}
.mm-prog .meter{flex:1;margin:0}
.mm-prog .meter i{background:var(--lv,var(--accent))}
.mm-qs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.mm-qs li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13px;line-height:1.45;color:var(--ink)}
.mm-qs .mk{font:700 13px var(--mono);text-align:center}
.mm-qs .mk.ok{color:var(--good)}
.mm-qs .mk.no{color:var(--bad)}
.mm-qs .mk.un{color:var(--muted)}
.mm-qs small{font:600 11px var(--mono);color:var(--muted);margin-right:4px}
.mm-note{font-size:12.5px;color:var(--muted)}
.mm-note a{color:var(--accent);font-weight:600}
</style>
</head>

const isOpen = n => n.children.length && open.has(n.id);
const iconHTML = (key, name) => key
  ? `<img src="${App.iconURL(key)}" alt="">`
  : `<span class="mm-ini" aria-hidden="true">${esc(name.split(/[\s&]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;

// ---------------------------------------------------------------- render and lay out
const GAP_X = 50;
const GAP_Y = { domain: 26, cat: 16, svc: 8, feat: 5 };
let visible = [];

function nodeHTML(n) {
  let inner = '';
  if (n.kind === 'root') inner = '<b>SAA-C03</b><small>Solutions Architect – Associate</small>';
  else if (n.kind === 'domain') inner = `<span class="mm-dn">${n.domain.n}</span><span><b>${esc(n.domain.short)}</b><small>${esc(n.domain.name)} · ${n.domain.weight}%</small></span>`;
  else if (n.kind === 'cat') inner = esc(n.label);
  else if (n.kind === 'svc') inner = iconHTML(S[n.name].icon, n.name) + `<span>${esc(n.name)}</span><span class="mm-n" title="Practice questions tagged with it">${S[n.name].q.length}</span>`;
  else inner = `<span>${esc(n.feat)}</span><span class="mm-n">${(S[n.name].fq[n.feat] || []).length}</span>`;
  if (n.kind !== 'root') inner += '<span class="mm-score"></span>';
  const label = n.kind === 'svc' || n.kind === 'feat' ? ' aria-haspopup="dialog"' : ` aria-expanded="${isOpen(n)}"`;
  let tog = '';
  if (n.children.length) {
    const what = n.kind === 'svc' ? 'features' : n.kind === 'cat' ? 'services' : n.kind === 'domain' ? 'categories' : 'domains';
    const name = n.kind === 'svc' ? n.name : n.kind === 'cat' ? n.label : n.kind === 'domain' ? n.domain.short : 'SAA-C03';
    tog = `<button type="button" class="mm-tog" data-tog aria-expanded="${isOpen(n)}" aria-label="${isOpen(n) ? 'Hide' : 'Show'} the ${n.children.length} ${what} of ${esc(name)}">${isOpen(n) ? '−' : n.children.length}</button>`;
  }
  return `<div class="mm-node mm-k-${n.kind}${n.id === selected ? ' sel' : ''}" data-id="${esc(n.id)}"><button type="button" class="mm-btn"${label}>${inner}</button>${tog}</div>`;
}

function render(anchor) {
  const before = anchor && anchor.el ? screenPos(anchor) : null;
  visible = [];
  (function walk(n) { visible.push(n); if (isOpen(n)) n.children.forEach(walk); })(root);
  nodesEl.innerHTML = visible.map(nodeHTML).join('');
  for (const el of nodesEl.children) {
    const n = byId.get(el.dataset.id);
    n.el = el;
    n.w = el.offsetWidth;
    n.h = el.offsetHeight;
  }
  span(root);
  place(root, 0, 0);
  for (const n of visible) { n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }
  drawLinks();
  paintOverlay();
  if (before) {   // keep the node that was clicked where it was on screen
    const after = screenPos(anchor);
    view.x += before.x - after.x;
    view.y += before.y - after.y;
    apply();
  }
}
// height of each visible subtree, then a top-down pass placing children beside their parent
function span(n) {
  if (!isOpen(n)) return (n.sh = n.h);
  const gap = GAP_Y[n.children[0].kind];
  n.kids = n.children.reduce((a, c) => a + span(c), 0) + gap * (n.children.length - 1);
  return (n.sh = Math.max(n.h, n.kids));
}
function place(n, x, top) {
  n.x = x;
  n.y = top + (n.sh - n.h) / 2;
  if (!isOpen(n)) return;
  const gap = GAP_Y[n.children[0].kind];
  let y = top + (n.sh - n.kids) / 2;
  const cx = x + n.w + GAP_X;
  for (const c of n.children) { place(c, cx, y); y += c.sh + gap; }
}
function drawLinks() {
  let d = '';
  for (const n of visible) {
    if (!isOpen(n)) continue;
    const x1 = n.x + n.w + 11, y1 = n.y + n.h / 2;
    for (const c of n.children) {
      const x2 = c.x, y2 = c.y + c.h / 2, mx = (x1 + x2) / 2;
      d += `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
    }
  }
  linksEl.innerHTML = `<path d="${d}"/>`;
}
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of visible) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w + 12); y1 = Math.max(y1, n.y + n.h); }
  return { x0, y0, x1, y1 };
}

// ---------------------------------------------------------------- overlay
function paintOverlay() {
  stage.classList.toggle('mm-on', overlay);
  $('overlayBtn').setAttribute('aria-checked', overlay);
  if (overlay) {
    for (const n of visible) {
      if (n.kind === 'root') continue;
      const st = stats(questionsOf(n));
      n.el.dataset.lv = st.lv;
      const sc = n.el.querySelector('.mm-score');
      sc.innerHTML = ring(st) + pctText(st);
      sc.title = st.total ? `${st.right} of ${st.tried} right · ${st.tried} of ${st.total} questions tried` : 'No practice questions tagged';
    }
  }
  const legend = $('legend');
  legend.hidden = !overlay;
  if (overlay) {
    const all = stats(questionsOf(root));
    legend.innerHTML = all.tried
      ? `<b style="color:var(--ink)">${all.tried} of ${all.total} questions tried · ${pctText(all)} right.</b> Latest answer per question; the ring shows how many you've tried.
        <div class="row"><span data-lv="good"><i></i>80%+</span><span data-lv="mid"><i></i>50–79%</span><span data-lv="bad"><i></i>under 50%</span><span><i></i>not tried</span></div>`
      : `No quiz answers are saved in this browser yet. <a href="../index.html">Practise in the Studio</a>, or sync your Gist there, and the map colours itself.`;
  }
}

// ---------------------------------------------------------------- pan and zoom
const apply = () => { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };
const clampK = k => Math.min(2, Math.max(0.3, k));
function screenPos(n) { return { x: view.x + n.x * view.k, y: view.y + n.y * view.k }; }
function panelCover() {   // the part of the stage the open panel hides: right side on desktop, bottom on phones
  if (panel.hidden) return { r: 0, b: 0 };
  const r = panel.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return matchMedia('(max-width:640px)').matches ? { r: 0, b: Math.max(0, s.bottom - r.top) } : { r: Math.max(0, s.right - r.left), b: 0 };
}
function glide() { world.classList.add('glide'); clearTimeout(glide.t); glide.t = setTimeout(() => world.classList.remove('glide'), 380); }
// Fit the open branches on screen. With a minimum scale (the first view, expand all) labels stay readable:
// whatever doesn't fit then starts from the top left, next to the root, and the rest is a drag away.
function fit(animate, minK = 0.3) {
  const b = bounds(), vw = viewport.clientWidth, vh = viewport.clientHeight;
  const top = 58, pad = 20, bottom = 56;   // leave room for the toolbar and the zoom buttons
  const k = clampK(Math.max(minK, Math.min((vw - pad * 2) / (b.x1 - b.x0), (vh - top - bottom) / (b.y1 - b.y0), 1)));
  const w = (b.x1 - b.x0) * k, h = (b.y1 - b.y0) * k;
  view.k = k;
  view.x = (w <= vw - pad * 2 ? (vw - w) / 2 : pad) - b.x0 * k;
  view.y = (h <= vh - top - bottom ? top + (vh - top - bottom - h) / 2 : top) - b.y0 * k;
  if (animate) glide();
  apply();
}
const READABLE = 0.7;
function zoomAt(px, py, f) {
  const k = clampK(view.k * f);
  view.x = px - (px - view.x) * (k / view.k);
  view.y = py - (py - view.y) * (k / view.k);
  view.k = k;
  touched = true;
  apply();
}
function zoomCentre(f) { glide(); zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, f); }
function centreOn(n, animate) {
  const c = panelCover();
  if (view.k < 0.7) view.k = 0.9;
  view.x = (viewport.clientWidth - c.r) / 2 - (n.x + n.w / 2) * view.k;
  view.y = (viewport.clientHeight - c.b) / 2 - (n.y + n.h / 2) * view.k;
  if (animate) glide();
  apply();
}
function ensureVisible(n) {
  const p = screenPos(n), c = panelCover(), m = 24;
  const w = n.w * view.k, h = n.h * view.k, vw = viewport.clientWidth - c.r, vh = viewport.clientHeight - c.b;
  let dx = 0, dy = 0;
  if (p.x < m) dx = m - p.x; else if (p.x + w > vw - m) dx = vw - m - p.x - w;
  if (p.y < 60) dy = 60 - p.y; else if (p.y + h > vh - m) dy = vh - m - p.y - h;
  if (dx || dy) { view.x += dx; view.y += dy; apply(); }
}

// dragging pans (one pointer) or pinches (two); a drag that starts on a node doesn't click it
const pts = new Map();
let drag = null, swallowClick = false;
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { moved: false, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, pinch: null };
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    drag.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
    drag.moved = true;
  }
});
viewport.addEventListener('pointermove', e => {
  if (!drag || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = viewport.getBoundingClientRect();
  if (pts.size >= 2 && drag.pinch) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, (drag.pinch.k * d / drag.pinch.d) / view.k);
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  if (!drag.moved) { drag.moved = true; try { viewport.setPointerCapture(e.pointerId); } catch (err) {} }
  viewport.classList.add('panning');
  view.x = drag.vx + dx;
  view.y = drag.vy + dy;
  touched = true;
  apply();
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (drag && drag.moved) { swallowClick = true; setTimeout(() => { swallowClick = false; }, 0); }
  if (!pts.size) { drag = null; viewport.classList.remove('panning'); }
  else if (drag) {   // one finger left after a pinch: carry on panning from here
    const [p] = [...pts.values()];
    Object.assign(drag, { x: p.x, y: p.y, vx: view.x, vy: view.y, pinch: null });
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);
viewport.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });

// ---------------------------------------------------------------- open, fold, select
function toggle(n) {
  if (!n.children.length) return;
  if (open.has(n.id)) open.delete(n.id); else open.add(n.id);
  open.add('root');
  save(OPEN_KEY, [...open]);
  render(n);
  const btn = n.el.querySelector('[data-tog]') || n.el.querySelector('.mm-btn');
  btn.focus({ preventScroll: true });
}
function reveal(n) { for (let p = n.parent; p; p = p.parent) open.add(p.id); save(OPEN_KEY, [...open]); }
function select(n, how) {
  selected = n.id;
  if (how === 'jump') { reveal(n); render(); }
  for (const v of visible) v.el.classList.toggle('sel', v.id === selected);
  showPanel(n);
  if (how === 'jump') centreOn(n, true); else ensureVisible(n);
}
nodesEl.addEventListener('click', e => {
  const el = e.target.closest('.mm-node');
  if (!el) return;
  const n = byId.get(el.dataset.id);
  if (e.target.closest('[data-tog]') || n.kind === 'root' || n.kind === 'domain' || n.kind === 'cat') toggle(n);
  else select(n);
});
nodesEl.addEventListener('focusin', e => {
  const el = e.target.closest('.mm-node');
  if (el && !drag) ensureVisible(byId.get(el.dataset.id));
});

$('expandBtn').addEventListener('click', () => {
  for (const n of byId.values()) if (n.children.length) open.add(n.id);
  save(OPEN_KEY, [...open]);
  render();
  fit(true, READABLE);
});
$('collapseBtn').addEventListener('click', () => {
  open.clear();
  ['root', 'd1', 'd2', 'd3', 'd4'].forEach(id => open.add(id));
  save(OPEN_KEY, [...open]);
  render();
  fit(true, READABLE);
});
$('overlayBtn').addEventListener('click', () => {
  overlay = !overlay;
  save(OVERLAY_KEY, overlay);
  readAttempts();
  render();
});
$('zoomIn').addEventListener('click', () => zoomCentre(1.25));
$('zoomOut').addEventListener('click', () => zoomCentre(0.8));
$('fitBtn').addEventListener('click', () => { touched = false; fit(true); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && !panel.hidden) { e.preventDefault(); closePanel(true); }
  else if (e.key === '+' || e.key === '=') zoomCentre(1.25);
  else if (e.key === '-') zoomCentre(0.8);
  else if (e.key === '0') { touched = false; fit(true); }
});

// ---------------------------------------------------------------- the detail panel
const CLOSE = '<button type="button" class="mm-x" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function progressHTML(list, what) {
  if (!list.length) return `<div><h3>Your answers</h3><p class="mm-note">No practice questions are tagged with ${what} yet.</p></div>`;
  const st = stats(list);
  const rows = list.map(qi => {
    const [bi, id, stem] = DATA.questions[qi];
    const r = latest(qi);
    const mk = r === 1 ? '<span class="mk ok" aria-label="Right">✓</span>' : r === 0 ? '<span class="mk no" aria-label="Wrong">✗</span>' : '<span class="mk un" aria-label="Not tried">○</span>';
    return `<li>${mk}<span><small>${esc(DATA.banks[bi].symbol)}${id}</small>${esc(stem)}</span></li>`;
  }).join('');
  const summary = st.tried
    ? `<span><b>${pctText(st)}</b> right</span><span class="meter" data-lv="${st.lv}"><i style="width:${Math.round(st.pct * 100)}%"></i></span><span class="mm-note">${st.tried} of ${st.total} tried</span>`
    : `<span class="mm-note">None of these ${st.total} questions tried yet.</span>`;
  return `<div><h3>Your answers</h3><div class="mm-prog">${summary}</div>
    <ol class="mm-qs">${rows}</ol>
    <p class="mm-note" style="margin-top:10px">Latest answer to each question in the <a href="../index.html">Studio's practice quizzes</a>, saved in this browser. α β γ are the three question sets.</p></div>`;
}
function serviceHTML(n) {
  const s = S[n.name];
  const dom = DATA.domains.find(d => d.n === s.domain);
  const chip = id => {
    const t = byId.get(id);
    return `<button type="button" class="mm-chip${t.kind === 'feat' ? ' noico' : ''}" data-jump="${esc(id)}">${t.kind === 'svc' ? iconHTML(S[t.name].icon, t.name) + esc(t.name) : esc(t.feat) + ` <span class="n">${(S[t.name].fq[t.feat] || []).length}</span>`}</button>`;
  };
  const counts = DATA.domains.map(d => ({ d, c: s.q.filter(qi => questionDomain(qi) === d.n).length })).filter(x => x.c);
  return `<div class="mm-p-head">${iconHTML(s.icon, n.name)}<div><h2 id="panelTitle">${esc(n.name)}</h2><p>${esc(s.cat)} · Domain ${dom.n}, ${esc(dom.short)}</p></div>${CLOSE}</div>
    <p class="mm-cue">${esc(s.cue)}</p>
    ${s.traps.length ? `<div><h3>Exam traps</h3><ul>${s.traps.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    ${counts.length ? `<div><h3>Tested in</h3><div class="mm-chips">${counts.map(({ d, c }) => `<span class="mm-chip noico${d.n === s.domain ? ' primary' : ''}"><b>${d.n}</b> ${esc(d.short)} <span class="n">${c}</span></span>`).join('')}</div></div>` : ''}
    ${s.twins.length ? `<div><h3>Don't confuse with</h3><div class="mm-chips">${s.twins.map(t => chip('s:' + t)).join('')}</div></div>` : ''}
    ${s.features.length ? `<div><h3>Features</h3><div class="mm-chips">${s.features.map(f => chip('f:' + n.name + '|' + f)).join('')}</div></div>` : ''}
    ${s.sheet || s.diagrams.length ? `<div><h3>Study</h3><div class="mm-links-list">
      ${s.sheet ? `<a href="${esc(s.sheet.href)}"><span>Cheat sheet</span>${esc(s.sheet.label)}</a>` : ''}
      ${s.diagrams.map(([id, num, title]) => `<a href="architectures.html#${esc(id)}"><span>Diagram ${num}</span>${esc(title)}</a>`).join('')}
    </div></div>` : ''}
    ${progressHTML(s.q, 'this service')}`;
}
function featureHTML(n) {
  const s = S[n.name];
  return `<div class="mm-p-head">${iconHTML(s.icon, n.name)}<div><h2 id="panelTitle">${esc(n.feat)}</h2><p>A feature of ${esc(n.name)}</p></div>${CLOSE}</div>
    <div class="mm-chips"><button type="button" class="mm-chip" data-jump="${esc('s:' + n.name)}">${iconHTML(s.icon, n.name)}Open ${esc(n.name)}</button>${s.sheet ? `<a class="mm-chip noico" href="${esc(s.sheet.href)}">Cheat sheet: ${esc(s.sheet.label)}</a>` : ''}</div>
    ${progressHTML(s.fq[n.feat] || [], 'this feature')}`;
}
const questionDomain = qi => DATA.questions[qi][3];

let panelFor = null;
function showPanel(n) {
  panelFor = n;
  panel.innerHTML = '<div class="mm-handle" aria-hidden="true"></div>' + (n.kind === 'svc' ? serviceHTML(n) : featureHTML(n));
  const wasHidden = panel.hidden;
  panel.hidden = false;
  panel.scrollTop = 0;
  if (wasHidden) panel.focus({ preventScroll: true });
}
function closePanel(returnFocus) {
  if (panel.hidden) return;
  panel.hidden = true;
  const n = panelFor;
  panelFor = null;
  selected = null;
  for (const v of visible) v.el.classList.remove('sel');
  if (returnFocus && n && n.el && n.el.isConnected) n.el.querySelector('.mm-btn').focus({ preventScroll: true });
}
panel.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closePanel(true); return; }
  const j = e.target.closest('[data-jump]');
  if (j) select(byId.get(j.dataset.jump), 'jump');
});

// ---------------------------------------------------------------- start
function setTopbarHeight() { document.documentElement.style.setProperty('--tbh', document.querySelector('.topbar').getBoundingClientRect().bottom + 'px'); }
setTopbarHeight();
readAttempts();
render();
fit(false, READABLE);
addEventListener('resize', () => { setTopbarHeight(); if (!touched) fit(false, READABLE); });
// another tab (the Studio, or a Gist sync) may save new answers
addEventListener('storage', e => {
  if (e.key && !DATA.banks.some(b => e.key === b.prefix + 'attempts')) return;
  readAttempts();
  if (overlay) paintOverlay();
  if (panelFor) showPanel(panelFor);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  readAttempts();
  if (overlay) paintOverlay();
});

$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('saa-theme', JSON.stringify(next)); } catch (e) {}
});
})();
</script>
</body>
</html>
