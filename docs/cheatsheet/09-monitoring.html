    {tab:'CloudTrail vs Config', type:'compare', cols:[['cloudtrail','CloudTrail'],['config','AWS Config']], rows:[

      ['Default','90 days of management events','Off until you enable the recorder'],
      ['Long-term','Trail to S3 (and CloudWatch Logs)','History in S3; aggregator for many accounts'],
      ['Acts','Events → EventBridge','Rules + automatic remediation']]},
    {tab:'CloudTrail options', type:'list', items:[
      ['Data events','S3 object-level and Lambda invoke activity; off by default.'],

      ['Insights','Flags unusual API activity volumes.'],
      ['Querying','CloudTrail Lake (SQL), or Athena on trail logs in S3.']]},
