<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAA-C03 Cheat Sheets</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%2310B981%27/%3E%3Crect%20x%3D%279.5%27%20y%3D%279.5%27%20width%3D%2713%27%20height%3D%2713%27%20rx%3D%272%27%20fill%3D%27none%27%20stroke%3D%27%230F172A%27%20stroke-width%3D%272.6%27/%3E%3Crect%20x%3D%2713.5%27%20y%3D%2713.5%27%20width%3D%275%27%20height%3D%275%27%20rx%3D%271%27%20fill%3D%27%230F172A%27/%3E%3Cpath%20d%3D%27M13%205v3M19%205v3M13%2024v3M19%2024v3M5%2013h3M5%2019h3M24%2013h3M24%2019h3%27%20stroke%3D%27%230F172A%27%20stroke-width%3D%272.4%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar nosub">
  <div class="topbar-in">
    <span class="brand"><a class="back-link" href="../index.html" aria-label="Back to SAA-C03 Studio" title="Back to Studio"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a><span class="brand-mark">C03</span><span class="brand-name">SAA-C03 Cheat Sheets</span></span>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<main class="wrap hub">
  <div>
    <div class="eyebrow">AWS Solutions Architect – Associate</div>
    <h1 style="margin-top:6px">Pick a domain</h1>
  </div>
  <p class="oneliner" style="margin-top:-8px">Each domain has the same layout: <b>Learn</b> one topic at a time, <b>Practice</b> with a quiz and flashcards, and <b>Revise</b> on one sheet the night before. Domains are ordered by how often they appear in your practice sets.</p>
  <div class="domains" id="domains"></div>
</main>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
const {img, $} = App;
/* [page, name, icon, topics, questions, share of your practice questions] */
const DOMAINS = [
  ['security','Security, Identity & Compliance','iam',7,38,83],
  ['networking','Networking & Content Delivery','vpc',7,41,64],
  ['compute','Compute & Serverless','ec2',7,49,61],
  ['storage','Storage & Backup','s3',7,36,54],
  ['databases','Databases & Caching','rds',7,34,48],
  ['integration','Application Integration','sqs',7,35,33],
  ['cost','Cost Management & Optimization','costexplorer',6,30,28],
  ['dr','Disaster Recovery & Migration','drs',5,28,27],
  ['monitoring','Monitoring, Management & Governance','cloudwatch',6,31,25],
  ['analytics','Analytics & Data Processing','athena',6,30,25]
];
const read = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
$('#domains').innerHTML = DOMAINS.map(([id,name,ico,topics,q,share], i)=>{
  const sec = read(`saa-${id}-sec`) || {};
  const passed = Object.values(sec).filter(v=>v>=4).length;
  return `<a class="domain" href="${String(i+1).padStart(2,'0')}-${id}.html">${img(ico,'','')}<b>${name}</b>
    <span>${topics} topics · ${q} questions · ${share} in your sets</span>
    <div class="meter" title="Topics passed (4/5 or better)"><i style="width:${passed/topics*100}%"></i></div>
    <span style="grid-column:1/-1">${passed ? `${passed} of ${topics} topics passed` : 'Not started'}</span></a>`;
}).join('');
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('saa-theme', JSON.stringify(next)); }catch(e){}
});
</script>
</body>
</html>
