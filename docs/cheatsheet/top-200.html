<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Top 200 · AWS SAA-C03 Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%2310B981%22%2F%3E%3Crect%20x%3D%226.5%22%20y%3D%226.5%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%222.5%22%20fill%3D%22%23A7F3D0%22%2F%3E%3Crect%20x%3D%2213.5%22%20y%3D%2213.5%22%20width%3D%2212%22%20height%3D%2212%22%20rx%3D%222.5%22%20fill%3D%22%23A7F3D0%22%2F%3E%3Cpath%20d%3D%22M13.5%2016a2.5%202.5%200%200%201%202.5-2.5h2.5V16a2.5%202.5%200%200%201-2.5%202.5h-2.5Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Top 200: the 200 questions ranked highest in ../sets/priority-map.json, with where each stands in this
   browser's practice (the latest answer, as the Studio counts it). The table scrolls inside its panel, so
   the page itself never scrolls sideways on a phone. */
.t2-head{margin:24px 0 14px}
.t2-head h1{margin:0;font-size:clamp(24px,4vw,30px);letter-spacing:-.02em}
.t2-head p{margin:4px 0 0;color:var(--muted)}
.t2-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.t2-filter{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
/* themed dropdowns in place of <select>, whose open list the system draws in its own colours */
.t2-dd{position:relative}
.t2-dd-btn{font:inherit;font-size:13px;color:var(--ink);background-color:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 28px 5px 10px;cursor:pointer;text-align:left;white-space:nowrap;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.t2-dd-btn:hover,.t2-dd-btn[aria-expanded="true"]{border-color:var(--accent)}
.t2-dd-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.t2-dd-list{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(340px,calc(100vw - 32px));max-height:min(320px,60vh);overflow-y:auto;
  margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);outline:none}
.t2-dd-list li{position:relative;padding:6px 10px 6px 26px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer}
.t2-dd-list li:hover,.t2-dd-list li.active{background:var(--surface-2)}
.t2-dd-list li[aria-selected="true"]{color:var(--accent);font-weight:600}
.t2-dd-list li[aria-selected="true"]::before{content:"✓";position:absolute;left:9px}
.t2-count{margin-left:auto;font:600 12px var(--mono);color:var(--muted)}
.t2-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.t2-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 55%,transparent) var(--surface-2);border-radius:14px}
.t2-scroll::-webkit-scrollbar{height:8px;width:8px}
.t2-scroll::-webkit-scrollbar-track{background:var(--surface-2);border-radius:999px}
.t2-scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 55%,transparent);border-radius:999px}
.t2-table{width:100%;min-width:880px;border-collapse:collapse;font-size:13px}
.t2-table th,.t2-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t2-table tbody tr:last-child td{border-bottom:0}
.t2-table tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.t2-table th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.t2-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.t2-table th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.t2-table th[aria-sort] button::after{content:"";font-size:10px}
.t2-table th[aria-sort="ascending"] button::after{content:"▲"}
.t2-table th[aria-sort="descending"] button::after{content:"▼"}
.t2-table th[aria-sort] button{color:var(--ink)}
.t2-num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t2-q{min-width:280px;max-width:420px}
.t2-sub{display:block;color:var(--muted);font-size:12px}
.t2-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t2-done{background:var(--good-soft);color:var(--good)}
.t2-missed{background:var(--bad-soft);color:var(--bad)}
.t2-unseen{background:var(--surface-2);color:var(--muted)}
.t2-note{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar nosub">
  <div class="topbar-in">
    <span class="brand"><a class="back-link" href="../index.html" aria-label="Back to the progress overview" title="Back to the progress overview"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a><a class="brand-mark" href="../index.html" title="Progress overview"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#10B981"/><rect x="6.5" y="6.5" width="12" height="12" rx="2.5" fill="#A7F3D0"/><rect x="13.5" y="13.5" width="12" height="12" rx="2.5" fill="#A7F3D0"/><path d="M13.5 16a2.5 2.5 0 0 1 2.5-2.5h2.5V16a2.5 2.5 0 0 1-2.5 2.5h-2.5Z" fill="#FFFFFF"/></svg></a><span class="brand-title"><a class="brand-app" href="../index.html" title="Progress overview">AWS SAA-C03 Studio</a><a class="brand-page" href="top-200.html" title="The top 200 questions">Top 200</a></span></span>
    <span style="margin-left:auto"></span>
    <button type="button" class="theme-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menuPanel" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<main class="wrap">
  <div class="t2-head">
    <h1>Top 200 questions</h1>
    <p>Your 200 highest-priority questions, and where each stands in your practice.</p>
  </div>
  <div class="t2-tools">
    <div class="t2-filter"><span id="bankFilterLabel">Set</span><div class="t2-dd" id="bankFilter"></div></div>
    <div class="t2-filter"><span id="statusFilterLabel">Status</span><div class="t2-dd" id="statusFilter"></div></div>
    <div class="t2-filter"><span id="sectionFilterLabel">Section</span><div class="t2-dd" id="sectionFilter"></div></div>
    <div class="t2-filter"><span id="difficultyFilterLabel">Difficulty</span><div class="t2-dd" id="difficultyFilter"></div></div>
    <span class="t2-count" id="count" aria-live="polite"></span>
  </div>
  <div class="t2-panel">
    <div class="t2-scroll">
      <table class="t2-table">
        <thead><tr id="heads"></tr></thead>
        <tbody id="rows"><tr><td class="t2-note" colspan="10">Loading the top 200…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
(function () {
'use strict';
// the sets, as BANKS in ../index.html names them (the map's keys)
const BANKS = { alpha: ['Set Alpha', 'α'], beta: ['Set Beta', 'β'], gamma: ['Set Gamma', 'γ'], delta: ['Set Delta', 'δ'] };
const BANK_ORDER = Object.keys(BANKS);
const DOMAINS = { 1: 'Secure', 2: 'Resilient', 3: 'High-performing', 4: 'Cost-optimized' };
const DIFFICULTY = { easy: 0, medium: 1, hard: 2 };
const STATUS = { missed: [0, 'Missed'], unseen: [1, 'Unseen'], done: [2, 'Done'] };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);

// each column: its heading, how its cell reads, and the value it sorts by
const COLUMNS = [
  { key: 'priority', label: 'Priority', cls: 't2-num', cell: r => r.priority, sort: r => r.priority },
  { key: 'ref', label: 'No.', cls: 't2-num', cell: r => `<span title="${esc(r.bankLabel)}, question ${r.id}">${esc(r.symbol)}${r.id}</span>`, sort: r => BANK_ORDER.indexOf(r.bank) * 10000 + r.id },
  { key: 'status', label: 'Status', cell: r => `<span class="t2-pill t2-${r.status}">${STATUS[r.status][1]}</span>`, sort: r => STATUS[r.status][0] },
  { key: 'question', label: 'Question', cls: 't2-q', cell: r => esc(r.stem), sort: r => r.stem },
  // the section, with its exam domain under it; sorted by exam domain, then section
  { key: 'section', label: 'Section & domain', cell: r => esc(r.section) + (DOMAINS[r.domain] ? `<span class="t2-sub">${r.domain} · ${DOMAINS[r.domain]}</span>` : ''), sort: r => (r.domain || 9) + ' ' + r.section },
  { key: 'difficulty', label: 'Difficulty', cell: r => esc(r.difficulty || '–'), sort: r => DIFFICULTY[r.difficulty] ?? 9 },
  { key: 'last', label: 'Last answered', cls: 't2-num', cell: r => r.last ? new Date(r.last).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '–', sort: r => r.last || 0 }
];
// A themed dropdown: a button that opens a list of choices ([value, text]). Like a select, it keeps .value and fires
// change. Arrow keys, Home and End move; Enter or Space chooses; Escape, Tab or a click elsewhere closes.
function dropdown(id, choices) {
  const root = $(id);
  let value = '', active = 0;
  root.innerHTML = `<button type="button" class="t2-dd-btn" id="${id}Btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${id}Label ${id}Btn"></button><ul class="t2-dd-list" role="listbox" tabindex="-1" aria-labelledby="${id}Label" hidden></ul>`;
  const btn = root.firstChild, list = root.lastChild;
  function paint() {
    btn.textContent = (choices.find(c => c[0] === value) || choices[0])[1];
    list.innerHTML = choices.map(([v, t], i) => `<li role="option" id="${id}-${i}" data-i="${i}" aria-selected="${v === value}"${i === active ? ' class="active"' : ''}>${esc(t)}</li>`).join('');
    list.setAttribute('aria-activedescendant', id + '-' + active);
    const li = list.children[active];
    if (li && !list.hidden) li.scrollIntoView({ block: 'nearest' });
  }
  function show(open, refocus) {
    if (open) document.querySelectorAll('.t2-dd').forEach(d => d !== root && d.close());
    list.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open) { active = Math.max(0, choices.findIndex(c => c[0] === value)); paint(); list.focus(); }
    else if (refocus) btn.focus();
  }
  function choose(i) {
    value = choices[i][0];
    show(false, true);
    paint();
    root.dispatchEvent(new Event('change'));
  }
  btn.addEventListener('click', () => show(list.hidden));
  btn.addEventListener('keydown', e => { if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); show(true); } });
  list.addEventListener('click', e => { const li = e.target.closest('li'); if (li) choose(Number(li.dataset.i)); });
  list.addEventListener('keydown', e => {
    const last = choices.length - 1;
    const to = { ArrowDown: Math.min(active + 1, last), ArrowUp: Math.max(active - 1, 0), Home: 0, End: last }[e.key];
    if (to !== undefined) { e.preventDefault(); active = to; paint(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape') { e.preventDefault(); show(false, true); }
    else if (e.key === 'Tab') show(false);
  });
  document.addEventListener('pointerdown', e => { if (!root.contains(e.target)) show(false); });
  root.close = () => { if (!list.hidden) show(false); };
  root.setChoices = c => { choices = c; paint(); };
  Object.defineProperty(root, 'value', { get: () => value });
  paint();
}
dropdown('bankFilter', [['', 'All sets']]);
dropdown('statusFilter', [['', 'Any status'], ['todo', 'Not done'], ['done', 'Done'], ['missed', 'Missed'], ['unseen', 'Unseen']]);
dropdown('sectionFilter', [['', 'All sections']]);
dropdown('difficultyFilter', [['', 'Any difficulty'], ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']]);

let sortKey = 'priority', sortDir = 1;   // priority order to start with; not saved
let rows = [];

// where a question stands, from the Studio's answers in this browser: [[1|0, time, flags], ...] per question
function standing(logs, bank, id) {
  if (!(bank in logs)) { try { logs[bank] = JSON.parse(localStorage.getItem('set_' + bank + '_attempts')) || {}; } catch (e) { logs[bank] = {}; } }
  const log = logs[bank][id];
  if (!Array.isArray(log) || !log.length) return { status: 'unseen', last: 0 };
  const latest = log[log.length - 1];
  return { status: latest[0] ? 'done' : 'missed', last: latest[1] || 0 };
}

function render() {
  const bank = $('bankFilter').value, status = $('statusFilter').value, section = $('sectionFilter').value, difficulty = $('difficultyFilter').value;
  const col = COLUMNS.find(c => c.key === sortKey);
  const logs = {};   // each set's answers, read once per drawing
  const shown = rows.map(r => Object.assign(r, standing(logs, r.bank, r.id)))
    .filter(r => (!bank || r.bank === bank) && (!status || (status === 'todo' ? r.status !== 'done' : r.status === status)) && (!section || r.section === section) && (!difficulty || r.difficulty === difficulty))
    .sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir || a.priority - b.priority; });
  $('heads').innerHTML = COLUMNS.map(c => `<th scope="col"${c.key === sortKey ? ` aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" data-sort="${c.key}" title="Sort by ${c.label.toLowerCase()}">${c.label}</button></th>`).join('');
  $('rows').innerHTML = shown.length
    ? shown.map(r => `<tr>${COLUMNS.map(c => `<td${c.cls ? ` class="${c.cls}"` : ''}>${c.cell(r)}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="t2-note" colspan="${COLUMNS.length}">No questions match these filters.</td></tr>`;
  const done = rows.filter(r => r.status === 'done').length;
  $('count').textContent = `${shown.length} shown · ${done} of ${rows.length} done`;
}

$('heads').addEventListener('click', e => {
  const b = e.target.closest('button[data-sort]');
  if (!b) return;
  if (b.dataset.sort === sortKey) sortDir = -sortDir;
  else { sortKey = b.dataset.sort; sortDir = 1; }
  render();
});
$('bankFilter').addEventListener('change', render);
$('statusFilter').addEventListener('change', render);
$('sectionFilter').addEventListener('change', render);
$('difficultyFilter').addEventListener('change', render);
// answers saved in another tab (the Studio, or its sync), or Back from the Studio restoring this page
addEventListener('storage', e => { if (!e.key || /^set_[a-z]+_attempts$/.test(e.key)) render(); });
addEventListener('pageshow', e => { if (e.persisted) render(); });

(async function load() {
  try {
    const map = await (await fetch('../sets/priority-map.json', { cache: 'no-cache' })).json();
    const top = map.questions.filter(e => e.priority <= 200).sort((a, b) => a.priority - b.priority);
    const sets = {};
    for (const bank of [...new Set(top.map(e => e.bank))]) {
      sets[bank] = await (await fetch('../sets/' + bank + '.json', { cache: 'no-cache' })).json();
    }
    rows = top.map(e => {
      const q = (sets[e.bank] || []).find(x => x.id === e.id);
      if (!q) return null;
      const text = q.question.replace(/\s+/g, ' ').trim();
      return { priority: e.priority, bank: e.bank, bankLabel: (BANKS[e.bank] || [e.bank])[0], symbol: (BANKS[e.bank] || ['', ''])[1], id: e.id,
        stem: text.length > 120 ? text.slice(0, 117).replace(/\s+\S*$/, '') + '…' : text,
        section: q.domain || '', domain: q.exam_domain, difficulty: q.difficulty };
    }).filter(Boolean);
    $('bankFilter').setChoices([['', 'All sets'], ...BANK_ORDER.filter(k => rows.some(r => r.bank === k)).map(k => [k, BANKS[k][1] + ' ' + BANKS[k][0]])]);
    const order = App.SHEETS.map(([, , name]) => name);
    const rank = name => (order.includes(name) ? order.indexOf(name) : order.length);
    $('sectionFilter').setChoices([['', 'All sections'], ...[...new Set(rows.map(r => r.section).filter(Boolean))]
      .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b)).map(name => [name, name])]);
    render();
  } catch (err) {
    $('rows').innerHTML = `<tr><td class="t2-note" colspan="${COLUMNS.length}">The top 200 couldn't be read (${esc(err.message)}). Open this page from the same web server as the Studio.</td></tr>`;
  }
})();
})();
</script>
</body>
</html>
